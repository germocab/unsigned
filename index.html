<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>One Chance</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
:root{
  --sky1:#0d1b2a; --sky2:#1b2a49; --ink:#eef2f7; --dim:#9fb0c8;
  --b1:#8fd3c8; --b2:#f2c6a0; --b3:#b7a8f0; --b4:#f0a9b8; --b5:#a9d2f5;
  --panel:#122036; --line:#2b3d5c;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  color:var(--ink);
  background:radial-gradient(ellipse at 30% 20%,var(--sky2),var(--sky1) 70%) fixed;
  overflow:hidden;-webkit-text-size-adjust:100%;
}
#space{position:fixed;inset:0;overflow:hidden;touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none}
#space.grabbing{cursor:grabbing}
#world{position:absolute;left:0;top:0;transform-origin:0 0;will-change:transform}
#world.anim{transition:transform .7s cubic-bezier(.3,.7,.2,1)}
.bubble{
  position:absolute;border-radius:50%;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  padding:11%;text-align:center;cursor:pointer;
  color:#0d1b2a;line-height:1.3;border:0;font-family:inherit;
  background:radial-gradient(circle at 32% 28%,rgba(255,255,255,.75),var(--c) 55%);
  box-shadow:0 0 30px -6px var(--c);
  animation:drift var(--d) ease-in-out infinite alternate;
  transition:transform .2s;-webkit-tap-highlight-color:transparent;
}
.bubble:hover,.bubble:focus-visible{transform:scale(1.08);z-index:5;outline:2px solid #fff}
.bubble.mine{z-index:2;box-shadow:0 0 0 3px rgba(255,255,255,.95),0 0 44px 6px var(--c)}
.bubble .num{flex:none;font-weight:700;letter-spacing:.02em;opacity:.8}
.bubble span{overflow:hidden;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:var(--lines);overflow-wrap:anywhere}
@keyframes drift{from{translate:0 0}to{translate:var(--dx) var(--dy)}}
.bubble.fresh{animation:drift var(--d) ease-in-out infinite alternate,pop .8s cubic-bezier(.2,1.4,.4,1)}
@keyframes pop{from{scale:0}to{scale:1}}

header{
  position:fixed;top:0;left:0;right:0;z-index:10;
  padding:calc(16px + env(safe-area-inset-top)) calc(20px + env(safe-area-inset-right)) 12px calc(20px + env(safe-area-inset-left));
  display:flex;justify-content:space-between;align-items:flex-start;gap:16px;pointer-events:none;
}
header>*{pointer-events:auto}
h1{margin:0;font-size:22px;font-weight:600;letter-spacing:.01em}
h1 small{font-size:12px;font-weight:400;color:var(--dim);margin-left:6px}
header p{margin:4px 0 0;color:var(--dim);font-size:14px;max-width:36ch;line-height:1.4}
.actions{display:flex;gap:10px;align-items:center}
.actions button{
  font:inherit;font-size:15px;border-radius:999px;padding:11px 20px;cursor:pointer;
  border:1px solid var(--line);background:rgba(18,32,54,.7);color:var(--ink);
  backdrop-filter:blur(6px);display:inline-flex;align-items:center;justify-content:center;gap:8px;
}
.actions button.write{background:var(--b2);color:#0d1b2a;border-color:var(--b2);font-weight:600}
.actions button.write:hover{background:#f7d6b8}
.actions button:not(.write):hover{background:#1b2d4a}
.actions button.mineBtn{padding:6px 18px 6px 8px}
.actions button.icon{width:46px;height:46px;padding:0;flex:none;border-radius:50%}
button:focus-visible,textarea:focus-visible{outline:2px solid #fff;outline-offset:2px}
[hidden]{display:none!important}

dialog{
  border:1px solid var(--line);border-radius:20px;background:var(--panel);color:var(--ink);
  width:min(540px,calc(100vw - 24px));max-height:calc(100dvh - 24px);
  padding:24px;font-family:inherit;overflow:auto;
}
dialog::backdrop{background:rgba(5,10,20,.7)}
dialog h2{margin:0 0 8px;font-size:20px;font-weight:600}
dialog h3{margin:20px 0 6px;font-size:15px;font-weight:600}
dialog p,dialog li{color:var(--dim);font-size:14px;line-height:1.55}
dialog p{margin:0 0 12px}
dialog ul{margin:0 0 12px;padding-left:20px}
dialog li{margin-bottom:4px}
.warn{
  border:1px solid var(--b2);background:rgba(242,198,160,.1);border-radius:12px;
  padding:12px 14px;margin:0 0 14px;font-size:14px;line-height:1.5;color:var(--ink)
}
.warn b{color:var(--b2)}
textarea{
  width:100%;height:150px;resize:vertical;border-radius:12px;border:1px solid var(--line);
  background:#0b1626;color:var(--ink);font:inherit;font-size:16px;padding:12px;line-height:1.5;
}
.row{display:flex;justify-content:space-between;align-items:center;margin-top:12px;gap:12px}
.count{color:var(--dim);font-size:13px}
.err{color:#f4a3a3;font-size:14px;min-height:20px;margin-top:10px;line-height:1.4}
.btns{display:flex;gap:8px}
.btns button{font:inherit;font-size:15px;border-radius:999px;padding:10px 18px;cursor:pointer;border:1px solid var(--line);background:transparent;color:var(--ink)}
.btns button.go{background:var(--b1);color:#0d1b2a;border-color:var(--b1);font-weight:600}
.btns button:disabled{opacity:.5;cursor:default}
.preview{
  white-space:pre-wrap;overflow-wrap:anywhere;color:var(--ink)!important;font-size:16px!important;
  border-left:3px solid var(--b3);padding:2px 0 2px 12px;margin:12px 0 14px!important;max-height:32dvh;overflow:auto
}
#reader{font-size:19px;line-height:1.6;white-space:pre-wrap;overflow-wrap:anywhere;margin:0 0 18px;color:var(--ink)}
.when{color:var(--dim);font-size:13px}
.readTop{display:flex;align-items:center;gap:12px;margin-bottom:10px}
.readTop p{margin:0}
.bigNum{font-size:24px;font-weight:700;color:var(--ink)}
#mineDlg .bigNum{text-align:center;margin:0 0 10px}
.nextnum{margin:0 0 12px!important;color:var(--b1)!important;font-weight:600}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:8px 0 4px}
.stat{border:1px solid var(--line);border-radius:14px;padding:12px 8px;text-align:center}
.stat b{display:block;font-size:22px;font-weight:600;color:var(--ink)}
.stat span{font-size:12px;color:var(--dim)}
.close-row{display:flex;justify-content:flex-end;margin-top:18px}
.hero{display:flex;justify-content:center;margin:6px 0 10px;position:relative}
.hero svg{width:150px;height:150px;overflow:visible;animation:bob 2.4s ease-in-out infinite;transition:filter .5s ease,transform .5s ease}
.hero.new svg{animation:hop .9s cubic-bezier(.2,1.5,.4,1),bob 2.4s ease-in-out .9s infinite}
.revealHint{color:var(--b1)!important;font-size:14px!important;margin:0 0 10px!important;transition:opacity .3s}
.bigName{font-size:24px!important;font-weight:700;color:var(--ink)!important;margin:0 0 4px!important}
.desc{color:var(--dim)!important;font-size:14px!important;margin:0 0 14px!important;transition:opacity .5s ease .1s}
.bigName,#mineTier,#minePreview,#shareMine{transition:opacity .5s ease .1s}
.confetti-piece{position:absolute;left:50%;top:50%;width:7px;height:7px;border-radius:2px;opacity:0;animation:confetti .9s ease-out forwards;pointer-events:none}
@keyframes confetti{0%{opacity:1;transform:translate(-50%,-50%) rotate(var(--ang)) translateY(0) scale(1)}100%{opacity:0;transform:translate(-50%,-50%) rotate(var(--ang)) translateY(-72px) scale(.3)}}
@keyframes bob{50%{transform:translateY(-6px)}}
@keyframes hop{from{transform:scale(0) rotate(-20deg)}to{transform:scale(1) rotate(0)}}
#mineDlg h2,#mineDlg .center{text-align:center}
#empty{position:fixed;inset:0;display:none;align-items:center;justify-content:center;color:var(--dim);text-align:center;padding:24px;line-height:1.5}
#status{position:fixed;bottom:74px;left:0;right:0;text-align:center;color:var(--dim);font-size:13px;z-index:10;pointer-events:none;padding:0 16px}

@media (max-width:640px){
  h1{font-size:19px}
  header p{font-size:13px;max-width:none}
  .actions{
    position:fixed;left:0;right:0;bottom:0;z-index:10;
    padding:12px calc(16px + env(safe-area-inset-right)) calc(12px + env(safe-area-inset-bottom)) calc(16px + env(safe-area-inset-left));
    background:linear-gradient(transparent,rgba(13,27,42,.92) 40%);
  }
  .actions button{flex:1;padding:14px 12px}
  .actions button.mineBtn{padding:6px 12px}
  .actions button.icon{flex:none;width:48px;height:48px;padding:0}
  dialog{padding:20px;border-radius:18px}
  #reader{font-size:18px}
  .stat b{font-size:19px}
}
@media (prefers-reduced-motion:reduce){
  #world.anim{transition:none}
  .bubble,.bubble.fresh,.hero svg,.hero.new svg,.confetti-piece{animation:none}
}

.actions button.icon{font-size:13px;font-weight:700;letter-spacing:.02em}
.stats{grid-template-columns:1fr}
.stat b{font-size:44px}
details{border-top:1px solid var(--line)}
details:last-of-type{border-bottom:1px solid var(--line)}
summary{cursor:pointer;padding:14px 0;font-size:15px;font-weight:600;list-style:none;display:flex;justify-content:space-between;align-items:center}
summary::-webkit-details-marker{display:none}
summary::after{content:"+";font-size:20px;font-weight:400;color:var(--dim)}
details[open] summary::after{content:"\2013"}
details>*:not(summary){margin-top:0}
.ver{font-weight:400;font-size:13px;color:var(--dim)}
#onboard{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;padding:24px;
  background:radial-gradient(ellipse at 30% 20%,var(--sky2),var(--sky1) 75%)}
.obCard{width:min(420px,100%);text-align:center}
.obBubble{
  width:150px;height:150px;margin:0 auto 26px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-size:64px;font-weight:700;color:#0d1b2a;
  background:radial-gradient(circle at 32% 28%,rgba(255,255,255,.75),var(--c) 55%);box-shadow:0 0 50px -8px var(--c);
  animation:bob 3s ease-in-out infinite
}
.obCard h2{font-size:26px;margin:0 0 10px}
.obCard p{font-size:17px;line-height:1.5;color:var(--dim);margin:0 0 22px}
.dots{display:flex;justify-content:center;gap:8px;margin-bottom:22px}
.dots span{width:8px;height:8px;border-radius:50%;background:var(--line)}
.dots span.on{background:var(--ink)}
.obCard .btns{justify-content:center}
.obLang{position:absolute;top:calc(16px + env(safe-area-inset-top));right:16px;width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:rgba(18,32,54,.7);color:var(--ink);font:inherit;font-size:13px;font-weight:700;cursor:pointer}
@media (prefers-reduced-motion:reduce){.obBubble{animation:none}}
.tag{font-size:12px;padding:2px 10px;border-radius:999px;border:1px solid var(--line);margin-left:6px;color:var(--dim);font-weight:400}
.tag.tier1{color:var(--b3);border-color:var(--b3)}
.tag.tier2{color:#ffd23f;border-color:#ffd23f}
#mineTier{margin:0 0 12px!important;color:var(--ink)!important;font-size:15px!important}
</style>
</head>
<body>
<header>
  <div>
    <h1>One Chance<small>v1.6.0</small></h1>
    <p data-i18n="tagline"></p>
  </div>
  <div class="actions">
    <button id="langBtn" class="icon" type="button" data-i18n-aria="langAria">ES</button>
    <button id="openStats" class="icon" type="button" data-i18n-aria="statsTitle"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><line x1="6" y1="20" x2="6" y2="11"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="18" y1="20" x2="18" y2="14"/></svg></button>
    <button id="openInfo" class="icon" type="button" data-i18n-aria="infoTitle"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9.5"/><line x1="12" y1="11" x2="12" y2="17"/><circle cx="12" cy="7.5" r=".6" fill="currentColor"/></svg></button>
    <button class="write" id="openWrite" type="button" data-i18n="write"></button>
    <button class="mineBtn" id="openMine" type="button" hidden><span id="mineIcon"></span><span data-i18n="mine"></span></button>
  </div>
</header>

<div id="space"><div id="world"></div></div>
<div id="empty" data-i18n-html="empty"></div>
<div id="status"></div>

<div id="onboard" hidden role="dialog" aria-modal="true" aria-labelledby="obTitle">
  <button class="obLang" id="obLangBtn" type="button" data-i18n-aria="langAria">ES</button>
  <div class="obCard">
    <div class="obBubble" id="obBubble">#</div>
    <h2 id="obTitle"></h2>
    <p id="obText"></p>
    <div class="dots" id="obDots"></div>
    <div class="btns"><button id="obSkip" type="button" data-i18n="obSkip"></button><button id="obNext" class="go" type="button"></button></div>
  </div>
</div>

<dialog id="writeDlg">
  <div id="stepWrite">
    <h2 data-i18n="writeTitle"></h2>
    <div class="warn" data-i18n-html="warn"></div>
    <p class="nextnum" id="nextNum" hidden></p>
    <p data-i18n="writeHelp"></p>
    <textarea id="text" maxlength="1000" data-i18n-ph="placeholder"></textarea>
    <div class="err" id="err" role="alert"></div>
    <div class="row">
      <span class="count" id="count">0 / 1000</span>
      <div class="btns">
        <button id="cancel" type="button" data-i18n="cancel"></button>
        <button id="review" class="go" type="button" data-i18n="cont"></button>
      </div>
    </div>
  </div>
  <div id="stepConfirm" hidden>
    <h2 data-i18n="confirmTitle"></h2>
    <p class="nextnum" id="nextNum2" hidden></p>
    <p data-i18n="confirmText"></p>
    <p class="preview" id="preview"></p>
    <div class="err" id="err2" role="alert"></div>
    <div class="btns" style="justify-content:flex-end">
      <button id="back" type="button" data-i18n="back"></button>
      <button id="publish" class="go" type="button" data-i18n="publish"></button>
    </div>
  </div>
</dialog>

<dialog id="mineDlg">
  <h2 id="mineTitle"></h2>
  <div class="hero" id="mineHero"></div>
  <p class="center revealHint" id="revealHint" data-i18n="revealing" hidden></p>
  <p class="bigNum" id="mineNum"></p>
  <p class="center bigName" id="mineName"></p>
  <p class="center" id="mineTier"></p>
  <p class="center desc" id="mineDesc"></p>
  <p class="center" id="mineText"></p>
  <p class="preview" id="minePreview"></p>
  <div class="close-row"><div class="btns"><button id="shareMine" type="button" data-i18n="share"></button><button id="findMine" type="button" data-i18n="findMine"></button><button id="closeMine" class="go" type="button" data-i18n="close"></button></div></div>
</dialog>

<dialog id="readDlg">
  <div class="readTop"><b class="bigNum" id="readNum"></b><p class="when" id="when"></p></div>
  <p id="reader"></p>
  <div class="btns"><button id="closeRead" type="button" data-i18n="close"></button></div>
</dialog>

<dialog id="statsDlg">
  <h2 data-i18n="statsTitle"></h2>
  <div class="stats"><div class="stat"><b id="sTotal">–</b><span data-i18n="statTotal"></span></div></div>
  <div class="close-row"><div class="btns"><button id="closeStats" class="go" type="button" data-i18n="close"></button></div></div>
</dialog>

<dialog id="infoDlg">
  <h2><span data-i18n="infoTitle"></span> <span class="ver">v1.6.0</span></h2>
  <details open>
    <summary data-i18n="aboutT"></summary>
    <p data-i18n="aboutP"></p>
  </details>
  <details>
    <summary data-i18n="howT"></summary>
    <ul>
      <li data-i18n="how1"></li><li data-i18n="how2"></li><li data-i18n="how3"></li><li data-i18n="how4"></li><li data-i18n="how5"></li>
    </ul>
  </details>
  <details>
    <summary data-i18n="privT"></summary>
    <p data-i18n="privP"></p>
  </details>
  <details>
    <summary data-i18n="rulesT"></summary>
    <ul>
      <li data-i18n="rule1"></li><li data-i18n="rule2"></li><li data-i18n="rule3"></li><li data-i18n="rule4"></li><li data-i18n="rule5"></li>
    </ul>
  </details>
  <details>
    <summary data-i18n="aiT"></summary>
    <p data-i18n="aiP"></p>
  </details>
  <div class="close-row" style="justify-content:space-between;gap:8px;flex-wrap:wrap">
    <div class="btns"><button id="replayIntro" type="button" data-i18n="replay"></button></div>
    <div class="btns"><button id="closeInfo" class="go" type="button" data-i18n="close"></button></div>
  </div>
</dialog>

<script>
/* ============ 1. PASTE YOUR SUPABASE VALUES HERE ============ */
const SUPABASE_URL = "https://omorfmddmizyjxduemcz.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9tb3JmbWRkbWl6eWp4ZHVlbWN6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTAyNzcyNTIsImV4cCI6MjEwNTg1MzI1Mn0.eNGY1-GDcbR5QAK4QlLVCMEJqsZDngDW9y2i0um78bY";
/* ============================================================ */

const MAX_BUBBLES = 200;
const STORE_KEY = "unsigned_mine";
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
const $ = id => document.getElementById(id);
const colors = ["--b1","--b2","--b3","--b4","--b5"];
const seen = new Set();
const els = new Map();

/* ---------- pan and zoom ---------- */
const world = $("world");
let view = {x:0,y:0,s:1}, W = innerWidth, H = innerHeight, moved = false;
const clamp = (v,a,b)=>Math.min(b,Math.max(a,v));
const minScale = ()=>clamp(Math.min(innerWidth/W, innerHeight/H), .1, 1);
function clampView(){
  view.s = clamp(view.s, minScale(), 2.5);
  const w = W*view.s, h = H*view.s;
  view.x = w<=innerWidth ? (innerWidth-w)/2 : clamp(view.x, innerWidth-w, 0);
  view.y = h<=innerHeight ? (innerHeight-h)/2 : clamp(view.y, innerHeight-h, 0);
}
function applyView(){ world.style.transform = `translate(${view.x}px,${view.y}px) scale(${view.s})`; }
function sizeWorld(){ // the universe grows as more bubbles are added
  const g = clamp(Math.round(Math.sqrt(seen.size/8)*4)/4, 1, 6);
  W = Math.round(innerWidth*g); H = Math.round(innerHeight*g);
  world.style.width = W+"px"; world.style.height = H+"px";
  clampView(); applyView();
}
function centerView(){ view.s = 1; view.x = (innerWidth-W)/2; view.y = (innerHeight-H)/2; clampView(); applyView(); }
function centerOn(el){
  if(!el) return;
  world.classList.add("anim");
  view.s = Math.max(view.s, 1);
  view.x = innerWidth/2 - (el.offsetLeft + el.offsetWidth/2)*view.s;
  view.y = innerHeight/2 - (el.offsetTop + el.offsetHeight/2)*view.s;
  clampView(); applyView();
  setTimeout(()=>world.classList.remove("anim"), 750);
}
function zoomAt(cx,cy,ns){
  const wx = (cx-view.x)/view.s, wy = (cy-view.y)/view.s;
  view.s = clamp(ns, minScale(), 2.5);
  view.x = cx - wx*view.s; view.y = cy - wy*view.s;
  clampView(); applyView();
}
const space = $("space");
const ptrs = new Map();
let drag = null, pinch = null;
const two = ()=>{ const [a,b] = [...ptrs.values()]; return {mx:(a.x+b.x)/2, my:(a.y+b.y)/2, d:Math.hypot(a.x-b.x,a.y-b.y)||1}; };
space.addEventListener("pointerdown", e=>{
  if(e.pointerType==="mouse" && e.button!==0) return;
  world.classList.remove("anim");
  ptrs.set(e.pointerId, {x:e.clientX, y:e.clientY});
  if(ptrs.size===1){ moved = false; drag = {x:e.clientX, y:e.clientY, sx:e.clientX, sy:e.clientY}; }
  else if(ptrs.size===2){
    moved = true; drag = null;
    const t = two(); pinch = {d:t.d, s:view.s, wx:(t.mx-view.x)/view.s, wy:(t.my-view.y)/view.s};
  }
});
window.addEventListener("pointermove", e=>{
  const p = ptrs.get(e.pointerId); if(!p) return;
  p.x = e.clientX; p.y = e.clientY;
  if(ptrs.size===2 && pinch){
    const t = two();
    view.s = clamp(pinch.s*t.d/pinch.d, minScale(), 2.5);
    view.x = t.mx - pinch.wx*view.s; view.y = t.my - pinch.wy*view.s;
    clampView(); applyView(); return;
  }
  if(ptrs.size===1 && drag){
    if(!moved){
      if(Math.hypot(e.clientX-drag.sx, e.clientY-drag.sy) < 6) return;
      moved = true; space.classList.add("grabbing"); drag.x = e.clientX; drag.y = e.clientY;
    }
    view.x += e.clientX-drag.x; view.y += e.clientY-drag.y;
    drag.x = e.clientX; drag.y = e.clientY;
    clampView(); applyView();
  }
});
function endPtr(e){
  if(!ptrs.delete(e.pointerId)) return;
  pinch = null;
  if(ptrs.size===1){ const r = [...ptrs.values()][0]; drag = {x:r.x, y:r.y, sx:r.x, sy:r.y}; }
  else if(ptrs.size===0){ drag = null; space.classList.remove("grabbing"); }
}

function hash(s){let h=2166136261;for(const c of s){h^=c.charCodeAt(0);h=Math.imul(h,16777619)}return h>>>0}
function rnd(seed,n){return ((Math.sin(seed+n)*10000)%1+1)%1}
function rng(seed){return ()=>{seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}

/* Everything about a character comes from the bubble id, so it is always the same one */
function traits(id){
  const r = rng(hash(id)), pick = a=>a[Math.floor(r()*a.length)];
  const roll = r();
  const o = {
    tier: roll<.03 ? 2 : roll<.18 ? 1 : 0,   // 0 common, 1 rare (sparkles), 2 golden
    sp: Math.floor(r()*SPECIES.length),
    body: pick(BODY), acc: pick(ACCENT),
    pat: pick(["none","none","belly","spots","stripes","tone"]),
    eyes: pick(EYES), brows: pick(["none","none","none","raised","angry","worried"]),
    mouth: pick(MOUTHS), hat: pick(HATS),
    cheeks: r()>.5, freckles: r()>.75, glasses: r()>.88, tie: r()>.88, wings: r()>.9
  };
  o.spots = [0,1,2,3].map(()=>[25+r()*50, 35+r()*45, 3+r()*4]);
  return o;
}

function eyesSvg(type,ey,k){
  const st = `stroke="${k}" stroke-width="3.5" fill="none" stroke-linecap="round"`;
  switch(type){
    case "big": return `<circle cx="38" cy="${ey}" r="9" fill="#fff"/><circle cx="62" cy="${ey}" r="9" fill="#fff"/><circle cx="40" cy="${ey+1}" r="4.5" fill="${k}"/><circle cx="60" cy="${ey+1}" r="4.5" fill="${k}"/>`;
    case "cyclops": return `<circle cx="50" cy="${ey}" r="12" fill="#fff"/><circle cx="52" cy="${ey+1}" r="6" fill="${k}"/>`;
    case "happy": return `<path d="M32 ${ey+3}Q39 ${ey-7} 46 ${ey+3}M54 ${ey+3}Q61 ${ey-7} 68 ${ey+3}" ${st}/>`;
    case "sleepy": return `<path d="M32 ${ey}Q39 ${ey+8} 46 ${ey}M54 ${ey}Q61 ${ey+8} 68 ${ey}" ${st}/>`;
    case "wink": return `<circle cx="39" cy="${ey}" r="4.5" fill="${k}"/><path d="M54 ${ey+3}Q61 ${ey-7} 68 ${ey+3}" ${st}/>`;
    case "sparkle": return sparkle(39,ey,7.5,k)+sparkle(61,ey,7.5,k);
    case "shiny": return `<circle cx="38" cy="${ey}" r="9" fill="#fff"/><circle cx="62" cy="${ey}" r="9" fill="#fff"/><circle cx="38" cy="${ey+1}" r="5.5" fill="${k}"/><circle cx="62" cy="${ey+1}" r="5.5" fill="${k}"/><circle cx="36" cy="${ey-1}" r="2" fill="#fff"/><circle cx="60" cy="${ey-1}" r="2" fill="#fff"/>`;
    case "oval": return `<ellipse cx="36" cy="${ey}" rx="8" ry="12" fill="${k}" transform="rotate(-18 36 ${ey})"/><ellipse cx="64" cy="${ey}" rx="8" ry="12" fill="${k}" transform="rotate(18 64 ${ey})"/><circle cx="33" cy="${ey-4}" r="2.5" fill="#fff"/><circle cx="61" cy="${ey-4}" r="2.5" fill="#fff"/>`;
    case "star": return `<circle cx="38" cy="${ey}" r="8" fill="#fff"/><circle cx="62" cy="${ey}" r="8" fill="#fff"/>`+sparkle(38,ey,4.5,k)+sparkle(62,ey,4.5,k);
    case "hearts": return `<path d="M38 ${ey-3}C35 ${ey-8} 28 ${ey-6} 28 ${ey-1}C28 ${ey+3} 38 ${ey+8} 38 ${ey+8}C38 ${ey+8} 48 ${ey+3} 48 ${ey-1}C48 ${ey-6} 41 ${ey-8} 38 ${ey-3}Z" fill="${k}"/><path d="M62 ${ey-3}C59 ${ey-8} 52 ${ey-6} 52 ${ey-1}C52 ${ey+3} 62 ${ey+8} 62 ${ey+8}C62 ${ey+8} 72 ${ey+3} 72 ${ey-1}C72 ${ey-6} 65 ${ey-8} 62 ${ey-3}Z" fill="${k}"/>`;
    default: return `<circle cx="39" cy="${ey}" r="4.5" fill="${k}"/><circle cx="61" cy="${ey}" r="4.5" fill="${k}"/>`;
  }
}
function mouthSvg(type,my,k){
  const line = `<path d="M40 ${my}Q50 ${my+10} 60 ${my}" stroke="${k}" stroke-width="3.5" fill="none" stroke-linecap="round"/>`;
  switch(type){
    case "open": return `<path d="M40 ${my}Q50 ${my+16} 60 ${my}Z" fill="${k}"/>`;
    case "o": return `<ellipse cx="50" cy="${my+3}" rx="4.5" ry="5.5" fill="${k}"/>`;
    case "cat": return `<path d="M38 ${my+2}Q44 ${my+9} 50 ${my+2}Q56 ${my+9} 62 ${my+2}" stroke="${k}" stroke-width="3.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>`;
    case "tongue": return `<ellipse cx="50" cy="${my+8}" rx="4.5" ry="5" fill="#ff6b8b"/>`+line;
    case "fang": return line+`<path d="M55 ${my+3.5}L59.5 ${my+2}L57.5 ${my+10}Z" fill="#fff" stroke="${k}" stroke-width="1.2" stroke-linejoin="round"/>`;
    case "flat": return `<path d="M42 ${my+3}L58 ${my+3}" stroke="${k}" stroke-width="3.5" stroke-linecap="round"/>`;
    case "grin": return `<path d="M38 ${my}Q50 ${my+13} 62 ${my}Z" fill="${k}"/><path d="M42 ${my+2}L44 ${my+7}L46 ${my+2}M50 ${my+2.5}L52 ${my+8}L54 ${my+2.5}M58 ${my+2}L56 ${my+7}L54 ${my+2}" fill="#fff"/>`;
    default: return line;
  }
}
function hatBack(hat,ty,a){
  switch(hat){
    case "antenna": return `<line x1="50" y1="${ty+4}" x2="50" y2="${ty-10}" stroke="${INK}" stroke-width="3" stroke-linecap="round"/><circle cx="50" cy="${ty-13}" r="6" fill="${a}"/>`;
    case "ears": return `<polygon points="26,${ty+14} 32,${ty-8} 46,${ty+4}" fill="${a}"/><polygon points="74,${ty+14} 68,${ty-8} 54,${ty+4}" fill="${a}"/>`;
    case "horns": return `<polygon points="34,${ty+8} 30,${ty-10} 46,${ty+2}" fill="${a}"/><polygon points="66,${ty+8} 70,${ty-10} 54,${ty+2}" fill="${a}"/>`;
    case "sprout": return `<line x1="50" y1="${ty+4}" x2="50" y2="${ty-8}" stroke="#2f9e5b" stroke-width="3" stroke-linecap="round"/><ellipse cx="41" cy="${ty-10}" rx="10" ry="5" fill="#4ade80" transform="rotate(-25 41 ${ty-10})"/><ellipse cx="59" cy="${ty-10}" rx="10" ry="5" fill="#4ade80" transform="rotate(25 59 ${ty-10})"/>`;
    case "round": return `<circle cx="28" cy="${ty+8}" r="10" fill="${a}"/><circle cx="72" cy="${ty+8}" r="10" fill="${a}"/>`;
    case "mask": return `<rect x="28" y="${ty+10}" width="44" height="10" rx="5" fill="${a}"/>`;
    default: return "";
  }
}
function hatFront(hat,ty,a){
  switch(hat){
    case "crown": return `<polygon points="36,${ty+6} 36,${ty-8} 43,${ty-1} 50,${ty-11} 57,${ty-1} 64,${ty-8} 64,${ty+6}" fill="#ffd23f" stroke="${INK}" stroke-width="2" stroke-linejoin="round"/>`;
    case "halo": return `<ellipse cx="50" cy="${ty-8}" rx="18" ry="5" fill="none" stroke="#ffd23f" stroke-width="4"/>`;
    case "party": return `<polygon points="40,${ty+5} 60,${ty+5} 50,${ty-20}" fill="${a}" stroke="${INK}" stroke-width="1.6" stroke-linejoin="round"/><circle cx="48" cy="${ty-4}" r="2" fill="#fff"/><circle cx="53" cy="${ty-11}" r="1.8" fill="#fff"/><circle cx="50" cy="${ty-22}" r="4" fill="#ffd23f"/>`;
    case "ribbon": return `<polygon points="66,${ty+5} 52,${ty-4} 52,${ty+12}" fill="#ff5d8f"/><polygon points="66,${ty+5} 80,${ty-4} 80,${ty+12}" fill="#ff5d8f"/><circle cx="66" cy="${ty+5}" r="4.5" fill="#ffb3c9"/>`;
    case "beanie": return `<path d="M30 ${ty+10}Q50 ${ty-16} 70 ${ty+10}Z" fill="${a}"/><rect x="28" y="${ty+6}" width="44" height="9" rx="4.5" fill="#fff" opacity=".85"/><circle cx="50" cy="${ty-8}" r="5" fill="#fff"/>`;
    case "flower": return `<circle cx="42" cy="${ty-8}" r="4" fill="#fff"/><circle cx="34" cy="${ty-4}" r="4" fill="#fff"/><circle cx="34" cy="${ty-12}" r="4" fill="#fff"/><circle cx="50" cy="${ty-12}" r="4" fill="#fff"/><circle cx="42" cy="${ty-8}" r="3" fill="#ffd23f"/>`;
    default: return "";
  }
}

function critter(id, px){
  const T_ = traits(id), S = SPECIES[T_.sp], h = hash(id).toString(36);
  const gold = T_.tier===2, a = T_.acc;
  const fill = gold ? `url(#g${h})` : T_.body;
  const k = S.ink || INK, ey = S.ey, my = S.my, ty = S.ty;
  const hat = S.hat ? T_.hat : "none";
  let o = `<defs><clipPath id="c${h}">${S.body("#000")}</clipPath>`;
  if(gold) o += `<linearGradient id="g${h}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff1a8"/><stop offset=".55" stop-color="#ffcc33"/><stop offset="1" stop-color="#e59a00"/></linearGradient><radialGradient id="l${h}"><stop offset="0" stop-color="#ffe27a" stop-opacity=".55"/><stop offset="1" stop-color="#ffe27a" stop-opacity="0"/></radialGradient>`;
  o += `</defs>`;
  if(gold) o += `<circle cx="50" cy="54" r="58" fill="url(#l${h})"/>`;
  o += `<ellipse cx="50" cy="97" rx="26" ry="4" fill="#000" opacity=".18"/>`;
  if(T_.wings) o += `<ellipse cx="9" cy="56" rx="9" ry="16" fill="#fff" opacity=".9" transform="rotate(-25 9 56)"/><ellipse cx="91" cy="56" rx="9" ry="16" fill="#fff" opacity=".9" transform="rotate(25 91 56)"/>`;
  o += hatBack(hat,ty,a);
  if(S.back) o += S.back(fill,a);
  o += S.body(fill);
  if(!S.nopat){
    let p = `<ellipse cx="36" cy="${ty+16}" rx="9" ry="5" fill="#fff" opacity=".35" transform="rotate(-35 36 ${ty+16})"/>`;
    if(T_.pat==="belly") p += `<ellipse cx="50" cy="${my+16}" rx="22" ry="14" fill="#fff" opacity=".3"/>`;
    if(T_.pat==="spots") p += T_.spots.map(s=>`<circle cx="${s[0].toFixed(1)}" cy="${s[1].toFixed(1)}" r="${s[2].toFixed(1)}" fill="#000" opacity=".13"/>`).join("");
    if(T_.pat==="stripes") p += `<path d="M-5 ${ty+16}Q50 ${ty+6} 105 ${ty+16}M-5 ${ty+30}Q50 ${ty+20} 105 ${ty+30}M-5 ${ty+44}Q50 ${ty+34} 105 ${ty+44}" stroke="#000" stroke-opacity=".11" stroke-width="6" fill="none"/>`;
    if(T_.pat==="tone") p += `<rect x="0" y="${my+8}" width="100" height="60" fill="#fff" opacity=".22"/>`;
    o += `<g clip-path="url(#c${h})">${p}</g>`;
  }
  if(S.mid) o += S.mid(fill,a,k);
  if(!S.plain){
    if(T_.cheeks) o += `<circle cx="30" cy="${ey+11}" r="5" fill="#ff5d8f" opacity=".45"/><circle cx="70" cy="${ey+11}" r="5" fill="#ff5d8f" opacity=".45"/>`;
    if(T_.freckles) o += [[27,9],[32,12],[30,5],[73,9],[68,12],[70,5]].map(f=>`<circle cx="${f[0]}" cy="${ey+f[1]}" r="1.6" fill="#a0522d" opacity=".6"/>`).join("");
  }
  const eyes = S.eyes || T_.eyes;
  o += eyesSvg(eyes,ey,k);
  if(T_.brows!=="none" && eyes!=="cyclops" && eyes!=="oval"){
    const d = {raised:`M31 ${ey-14}Q38 ${ey-19} 45 ${ey-14}M55 ${ey-14}Q62 ${ey-19} 69 ${ey-14}`,
               angry:`M31 ${ey-17}L45 ${ey-11}M69 ${ey-17}L55 ${ey-11}`,
               worried:`M31 ${ey-11}L45 ${ey-16}M69 ${ey-11}L55 ${ey-16}`}[T_.brows];
    o += `<path d="${d}" stroke="${k}" stroke-width="3" fill="none" stroke-linecap="round"/>`;
  }
  if(T_.glasses && !S.plain && eyes!=="cyclops" && eyes!=="oval")
    o += `<circle cx="38" cy="${ey}" r="11.5" fill="none" stroke="${k}" stroke-width="2.6"/><circle cx="62" cy="${ey}" r="11.5" fill="none" stroke="${k}" stroke-width="2.6"/><path d="M49.5 ${ey}L50.5 ${ey}" stroke="${k}" stroke-width="2.6"/>`;
  o += mouthSvg(T_.mouth,my,k);
  if(S.front) o += S.front(fill,a,k);
  if(T_.tie){ const y = Math.min(my+14,86);
    o += `<polygon points="50,${y} 37,${y-7} 37,${y+7}" fill="${a}"/><polygon points="50,${y} 63,${y-7} 63,${y+7}" fill="${a}"/><circle cx="50" cy="${y}" r="3.5" fill="${INK}"/>`; }
  o += hatFront(hat,ty,a);
  if(T_.tier>0) o += sparkle(9,10,6,"#ffe680")+sparkle(91,16,5,"#ffe680")+sparkle(89,84,6.5,"#ffe680")+sparkle(10,78,4.5,"#ffe680");
  return `<svg viewBox="0 -8 100 108" width="${px}" height="${px}" style="overflow:visible" aria-hidden="true">${o}</svg>`;
}

/* ---------- private-info check (runs before publishing) ---------- */
const CHECKS = [
  [/[a-z0-9._%+-]+@[a-z0-9.-]+\.[a-z]{2,}/i, "email"],
  [/(^|\s)@\w/, "handle"],
  [/(\d[\s().+-]*){7,}/, "phone"],
  [/(https?:\/\/|www\.)|\b[a-z0-9-]+\.(com|net|org|io|cl|me|co)\b/i, "link"],
  [/\b(instagram|insta|ig|snapchat|snap|tiktok|telegram|whatsapp|discord|twitter|facebook)\b\s*[:\-]?\s*\S/i, "social"],
  [/\b(my name is|i am called|i'm called|call me|me llamo|mi nombre es|soy)\s+[A-ZÁÉÍÓÚÑ][a-záéíóúñ]+/, "name"]
];
const findPrivate = t => CHECKS.filter(([re]) => re.test(t)).map(c => c[1]);

/* ---------- bubble rendering ---------- */
function addBubble(row,fresh){
  if(seen.has(row.id)) return els.get(row.id);
  seen.add(row.id);
  $("empty").style.display="none";
  const h = hash(row.id);
  const small = innerWidth < 640;
  const size = Math.round(Math.min(230, 112 + Math.sqrt(row.body.length)*9) * (small ? .85 : 1));
  const fs = size>150 ? 14 : 12.5;
  const numH = Math.round(fs*1.6);
  const lines = Math.max(1, Math.floor((size*.78 - numH) / (fs*1.3)));
  const b = document.createElement("button");
  b.className = "bubble" + (fresh?" fresh":"") + (mine && mine.id===row.id ? " mine" : "");
  b.type = "button";
  b.style.width = b.style.height = size+"px";
  b.style.left = `calc((100% - ${size}px) * ${rnd(h,1).toFixed(3)})`;
  b.style.top = `calc(90px + (100% - ${size}px - ${small?190:110}px) * ${rnd(h,2).toFixed(3)})`;
  b.style.setProperty("--c",`var(${colors[h%colors.length]})`);
  b.style.setProperty("--d",(9+rnd(h,3)*10).toFixed(1)+"s");
  b.style.setProperty("--dx",((rnd(h,4)-.5)*(small?30:50)).toFixed(0)+"px");
  b.style.setProperty("--dy",((rnd(h,5)-.5)*(small?30:50)).toFixed(0)+"px");
  b.style.setProperty("--lines",lines);
  b.style.fontSize = fs+"px";
  if(row.num!=null){
    const n = document.createElement("div");
    n.className = "num";
    n.style.fontSize = Math.round(fs*(size>150?1.5:1.35))+"px";
    n.textContent = "#"+row.num;
    b.appendChild(n);
  }
  const s = document.createElement("span");
  s.textContent = row.body; // textContent: never render user text as HTML
  b.appendChild(s);
  b.dataset.id = row.id;
  b.addEventListener("click",e=>{ if(moved && e.detail!==0) return; openRead(row); });
  world.appendChild(b);
  els.set(row.id, b);
  while(world.children.length > MAX_BUBBLES){ els.delete(world.firstChild.dataset.id); world.removeChild(world.firstChild); }
  sizeWorld();
  return b;
}

function openRead(row){
  $("readNum").textContent = row.num!=null ? t("bubble")+" #"+row.num : t("bubble");
  $("reader").textContent = row.body;
  $("when").textContent = new Date(row.created_at).toLocaleString(lang);
  $("readDlg").showModal();
}

/* ---------- load + live updates ---------- */
async function load(){
  const {data,error} = await sb.from("bubbles").select("*")
    .order("created_at",{ascending:false}).limit(MAX_BUBBLES);
  if(error){ $("status").textContent = t("loadErr"); return; }
  if(!data.length) $("empty").style.display="flex";
  data.reverse().forEach(r=>addBubble(r,false));
  sizeWorld(); centerView();
  if(data.length){
    const hint = t("hint");
    $("status").textContent = hint;
    setTimeout(()=>{ if($("status").textContent===hint) $("status").textContent=""; }, 7000);
  }
}

/* ---------- my character ---------- */
function fmtDuration(ms){
  const s = Math.max(1, Math.round((ms||0)/1000));
  if(s<60) return lang==="es" ? `${s} segundo${s===1?"":"s"}` : `${s} second${s===1?"":"s"}`;
  const m = Math.max(1, Math.round(s/60));
  return lang==="es" ? `${m} minuto${m===1?"":"s"}` : `${m} minute${m===1?"":"s"}`;
}
function confettiBurst(host){
  host.querySelectorAll(".confetti-piece").forEach(n=>n.remove());
  const n = 14;
  for(let i=0;i<n;i++){
    const s = document.createElement("span");
    s.className = "confetti-piece";
    s.style.setProperty("--ang", (360/n*i + (Math.random()*20-10))+"deg");
    s.style.background = [...BODY,...ACCENT][Math.floor(Math.random()*(BODY.length+ACCENT.length))];
    s.style.animationDelay = (Math.random()*.15)+"s";
    host.appendChild(s);
    setTimeout(()=>s.remove(), 1100);
  }
}
function showMine(isNew){
  const tr = traits(mine.id);
  const name = t("nm"+tr.sp), species = t("sp"+tr.sp);
  const desc = t("ds"+tr.sp, {time: fmtDuration(mine.elapsedMs), len: mine.len ?? mine.body.length});
  $("mineTitle").textContent = isNew ? t("earned") : t("yours");
  $("mineHero").className = "hero" + (isNew ? " new" : "");
  $("mineHero").innerHTML = critter(mine.id, 150);
  $("mineName").textContent = name;
  $("mineDesc").textContent = desc;
  $("mineText").textContent = isNew ? t("earnedText") : t("usedText");
  $("minePreview").textContent = mine.body;
  const tb = document.createElement("b"), tg = document.createElement("span");
  tb.textContent = species+" · "; tg.className = "tag tier"+tr.tier; tg.textContent = t("tier"+tr.tier);
  $("mineTier").replaceChildren(tb, tg);
  $("mineNum").textContent = mine.num!=null ? t("bubble")+" #"+mine.num : "";
  const reveal = ["mineName","mineTier","mineDesc","minePreview","shareMine"].map($);
  if(isNew){
    $("revealHint").hidden = false;
    $("mineHero").querySelector("svg").style.filter = "blur(10px) grayscale(1)";
    reveal.forEach(e=>e.style.opacity = 0);
    $("mineDlg").showModal();
    setTimeout(()=>{
      $("revealHint").hidden = true;
      const svg = $("mineHero").querySelector("svg");
      if(svg) svg.style.filter = "";
      reveal.forEach(e=>e.style.opacity = 1);
      confettiBurst($("mineHero"));
    }, 900);
  }else{
    $("revealHint").hidden = true;
    reveal.forEach(e=>e.style.opacity = 1);
    $("mineDlg").showModal();
  }
}
$("openMine").onclick = ()=>showMine(false);
$("findMine").onclick = ()=>{ $("mineDlg").close(); centerOn(els.get(mine.id)); };

/* ---------- share character ---------- */
function wrapText(ctx,text,x,y,maxWidth,lineHeight){
  const words = text.split(" "); let line = "", yy = y;
  for(const w of words){
    const test = line+w+" ";
    if(ctx.measureText(test).width>maxWidth && line){ ctx.fillText(line,x,yy); line=w+" "; yy+=lineHeight; }
    else line = test;
  }
  ctx.fillText(line,x,yy);
  return yy;
}
function renderCharacterPng(id,name,desc){
  return new Promise((resolve,reject)=>{
    const svgUrl = "data:image/svg+xml;base64,"+btoa(unescape(encodeURIComponent(critter(id,420))));
    const img = new Image();
    img.onload = ()=>{
      const W=600,H=740;
      const c = document.createElement("canvas"); c.width=W; c.height=H;
      const ctx = c.getContext("2d");
      const g = ctx.createRadialGradient(W*.32,H*.24,20,W*.32,H*.24,W*.9);
      g.addColorStop(0,"#1b2a49"); g.addColorStop(1,"#0d1b2a");
      ctx.fillStyle = g; ctx.fillRect(0,0,W,H);
      ctx.drawImage(img,(W-420)/2,50,420,420);
      ctx.textAlign = "center";
      ctx.fillStyle = "#eef2f7"; ctx.font = "700 42px system-ui,sans-serif";
      ctx.fillText(name, W/2, 500);
      ctx.fillStyle = "#9fb0c8"; ctx.font = "400 16px system-ui,sans-serif";
      const yy = wrapText(ctx, desc, W/2, 540, 480, 24);
      ctx.fillStyle = "#8fd3c8"; ctx.font = "600 16px system-ui,sans-serif";
      ctx.fillText(t("shareCta")+" "+(location.host||location.href), W/2, Math.max(yy+50, H-40));
      c.toBlob(b=> b ? resolve(b) : reject(new Error("no blob")), "image/png");
    };
    img.onerror = reject;
    img.src = svgUrl;
  });
}
async function shareCharacter(){
  const tr = traits(mine.id);
  const name = t("nm"+tr.sp), species = t("sp"+tr.sp);
  const desc = t("ds"+tr.sp, {time: fmtDuration(mine.elapsedMs), len: mine.len ?? mine.body.length});
  const url = location.origin + location.pathname;
  const text = `${name} — ${species}\n${desc}\n\n${t("shareCta")} ${url}`;
  try{
    const blob = await renderCharacterPng(mine.id, name, desc);
    const file = new File([blob], name.toLowerCase()+".png", {type:"image/png"});
    if(navigator.canShare && navigator.canShare({files:[file]})){
      await navigator.share({files:[file], title:name, text}); return;
    }
    if(navigator.share){ await navigator.share({title:name, text, url}); return; }
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob); a.download = file.name; a.click();
    setTimeout(()=>URL.revokeObjectURL(a.href), 4000);
    try{ await navigator.clipboard.writeText(url); $("status").textContent = t("linkCopied"); setTimeout(()=>{ if($("status").textContent===t("linkCopied")) $("status").textContent=""; },4000); }catch(e){}
  }catch(e){
    try{ await navigator.clipboard.writeText(text); $("status").textContent = t("linkCopied"); setTimeout(()=>{ if($("status").textContent===t("linkCopied")) $("status").textContent=""; },4000); }
    catch(_){ $("status").textContent = t("shareFail"); }
  }
}
$("shareMine").onclick = shareCharacter;

/* ---------- writing (one bubble per device) ---------- */
const ta = $("text");
function showStep(step){
  $("stepWrite").hidden = step!=="write";
  $("stepConfirm").hidden = step!=="confirm";
}
async function showNext(){
  ["nextNum","nextNum2"].forEach(i=>$(i).hidden=true);
  try{
    const {data,error} = await sb.from("bubbles").select("num").order("num",{ascending:false}).limit(1);
    if(error) return;
    const n = ((data[0] && data[0].num) || 0) + 1;
    ["nextNum","nextNum2"].forEach(i=>{ $(i).textContent = t("next",{n}); $(i).hidden=false; });
  }catch(e){}
}
let writeStartTs = null;
$("openWrite").onclick = ()=>{
  if(mine){ showMine(false); return; }
  showNext();
  $("err").textContent = ""; $("err2").textContent = "";
  showStep("write");
  writeStartTs = Date.now();
  $("writeDlg").showModal(); ta.focus();
};
$("cancel").onclick = ()=>$("writeDlg").close();
ta.oninput = ()=>{ $("count").textContent = ta.value.length+" / 1000"; $("err").textContent=""; };

$("review").onclick = ()=>{
  const text = ta.value.trim();
  if(!text){ $("err").textContent=t("writeFirst"); return; }
  const hits = findPrivate(text);
  if(hits.length){
    $("err").textContent = t("remove",{list:hits.map(k=>t("chk_"+k)).join(", ")});
    return;
  }
  $("preview").textContent = text;
  $("err2").textContent = "";
  showStep("confirm");
};
$("back").onclick = ()=>{ showStep("write"); ta.focus(); };

$("publish").onclick = async ()=>{
  if(mine){ $("writeDlg").close(); showMine(false); return; }
  const text = ta.value.trim();
  $("publish").disabled = true;
  const {data,error} = await sb.from("bubbles").insert({body:text}).select().single();
  $("publish").disabled = false;
  if(error){
    $("err2").textContent = /check constraint/i.test(error.message) ? t("pubPrivate") : t("pubFail");
    return;
  }
  saveMine(data, {elapsedMs: Date.now() - (writeStartTs||Date.now()), len: text.length});
  const el = addBubble(data,true);
  centerOn(el);
  ta.value=""; $("count").textContent="0 / 1000";
  $("writeDlg").close();
  showMine(true);
};
